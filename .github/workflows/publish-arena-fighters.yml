name: Publish Arena Fighter Models

on:
  workflow_run:
    workflows: ["Generate Arena Fighters"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'push' ||
           github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generated fighter models
        uses: actions/download-artifact@v4
        with:
          name: arena-fighter-models
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: generated

      - name: Validate and stage GLB files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          for (const name of ['volt', 'vex']) {
            const path = `generated/${name}.glb`;
            if (!fs.existsSync(path)) throw new Error(`Missing ${path}`);
            const data = fs.readFileSync(path);
            if (data.length < 20 || data.toString('ascii', 0, 4) !== 'glTF') {
              throw new Error(`Invalid GLB header: ${path}`);
            }
            if (data.readUInt32LE(4) !== 2 || data.readUInt32LE(8) !== data.length) {
              throw new Error(`Invalid GLB version or length: ${path}`);
            }
            fs.copyFileSync(path, `public/models/${name}.glb`);
            console.log(`Validated ${name}.glb (${(data.length / 1048576).toFixed(2)} MB)`);
          }
          NODE

      - name: Commit generated models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/volt.glb public/models/vex.glb
          if git diff --cached --quiet; then
            echo "Generated models are unchanged."
            exit 0
          fi
          git commit -m "Add generated VOLT and VEX GLB models"
          git push origin HEAD:main
